<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta charset="utf-8">
  <title>اختبار الواقع المعزز</title>
  
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>
  
  <style>
    body { margin: 0; overflow: hidden; }
    #msg-card {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.85);
      color: #00ffcc;
      padding: 12px 20px;
      border-radius: 15px;
      font-size: 16px;
      font-family: sans-serif;
      z-index: 999;
      display: none;
      text-align: center;
      border: 1px solid #00ffcc;
    }
  </style>
</head>
<body>

  <div id="msg-card">✨ تم التعرف على الصورة: مسقط ➔ صور</div>

  <a-scene 
    mindar-image="imageTargetSrc: ./targets.mind;" 
    color-space="sRGB" 
    renderer="colorManagement: true, physicallyCorrectLights" 
    vr-mode-ui="enabled: false" 
    device-orientation-permission-ui="enabled: false">
    
    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <a-entity id="target" mindar-image-target="targetIndex: 0">
      <!-- مكعب ثلاثي الأبعاد بديل للاختبار المباشر -->
      <a-box position="0 0 0.1" scale="0.3 0.3 0.3" color="#0d6efd"
             animation="property: rotation; to: 0 360 0; dur: 4000; loop: true; easing: linear">
      </a-box>
    </a-entity>
  </a-scene>

  <script>
    const target = document.getElementById('target');
    const msgCard = document.getElementById('msg-card');

    target.addEventListener("targetFound", () => {
      msgCard.style.display = "block";
    });

    target.addEventListener("targetLost", () => {
      msgCard.style.display = "none";
    });
  </script>
</body>
</html>
